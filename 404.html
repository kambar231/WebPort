<style>
:root{
  --sky1:#cfe0ef;--sky2:#eef0ea;--ink:#1d2733;--dim:#5d6b79;
  --sans:'Hanken Grotesk',system-ui,sans-serif;--serif:'Instrument Serif',Georgia,serif;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  color:var(--ink);font:400 16px/1.6 var(--sans);text-align:center;
  background:linear-gradient(180deg,var(--sky1),var(--sky2) 55%,#f4f0e8)}
::selection{background:var(--ink);color:#fff}
main{padding:24px}
.code{font:300 clamp(5rem,18vw,9rem)/1 var(--sans);letter-spacing:.08em;opacity:.9}
h1{font:400 clamp(1.4rem,4vw,2rem)/1.3 var(--serif);font-style:italic;margin:.4em 0 .5em}
p{color:var(--dim);margin:0 0 28px}
a{display:inline-block;color:var(--ink);text-decoration:none;font-weight:500;font-size:14px;
  letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--ink);border-radius:999px;
  padding:12px 28px;transition:background .2s,color .2s}
a:hover{background:var(--ink);color:#fff}
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>This page drifted off with the clouds.</h1>
  <p>The address you followed doesn&rsquo;t exist here.</p>
  <!-- root-relative: GitHub Pages serves 404.html at any depth -->
  <a href="/WebPort/">Back to the portfolio</a>
</main>
</body>
